<body><canvas id="c"></canvas>
<script src="lousa.js"></script>
<script>
const W = innerWidth, H = innerHeight, S = W / 1920;

const Q = new URLSearchParams(location.search);

const RED = '#e0513c', WHITE = '#f6f1e6';

const IMG = {}; const load = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
let TL = null, CU = null;

// ---------- texto ----------
function font(size, w = 800, fam = 'Montserrat') { g.font = `${w} ${Math.round(size)}px ${fam}, sans-serif`; }
function measure(s, size, w, fam) { font(size, w, fam); return g.measureText(s).width; }
function wrap(s, maxW, size, w = 800, fam = 'Montserrat') { const words = s.split(' '), lines = []; let cur = ''; words.forEach(x => { const t = cur ? cur + ' ' + x : x; if (measure(t, size, w, fam) > maxW && cur) { lines.push(cur); cur = x; } else cur = t; }); if (cur) lines.push(cur); return lines; }

  if (clipP < 1) { g.beginPath(); g.rect(x0 - 20, y - size * 1.2, (tw + 40) * clipP, size * 1.7); g.clip(); }
  if (shadow) { g.shadowColor = 'rgba(0,0,0,0.65)'; g.shadowBlur = size * 0.18; g.shadowOffsetY = size * 0.05; }
  g.fillStyle = gold ? goldG(x0, y - size, x0 + tw, y) : fill; g.fillText(s, x0, y); g.restore();

function para(s, x, y, maxW, o = {}) { const size = o.size || 48, lh = o.lh || 1.22, L = wrap(s, maxW, size, o.w || 800, o.fam || 'Montserrat'); L.forEach((l, i) => txt(l, x, y + i * size * lh, { ...o, alpha: (o.alpha ?? 1) * (o.stagger ? eo(P(o.t ?? 1e9, (o.t0 || 0) + i * o.stagger, 0.4)) : 1) })); return L.length * size * lh; }

// ---------- fundo ----------
const PART = Array.from({ length: 90 }, () => ({ x: rnd(0, 1920), y: rnd(0, 1080), vx: rnd(-6, 6), vy: rnd(6, 22), r: rnd(0.8, 3.2), ph: rnd(0, 6.28), big: R() < 0.12 }));
function drawBG(t, dim = 1) {
  const gr = g.createRadialGradient(W * 0.52, H * 0.42, 40, W * 0.5, H * 0.5, W * 0.78); gr.addColorStop(0, '#5a4020'); gr.addColorStop(0.5, '#33230f'); gr.addColorStop(1, '#150e06'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.save(); g.scale(S, S);
  const sx = ((t * 38) % 3400) - 900; const sw = g.createLinearGradient(sx, 0, sx + 700, 0); sw.addColorStop(0, 'rgba(255,214,120,0)'); sw.addColorStop(0.5, 'rgba(255,214,120,0.045)'); sw.addColorStop(1, 'rgba(255,214,120,0)');
  g.save(); g.transform(1, 0, -0.35, 1, 0, 0); g.fillStyle = sw; g.fillRect(sx, 0, 700, 1080); g.restore();
  PART.forEach(p => { const x = ((p.x + p.vx * t) % 1920 + 1920) % 1920, y = ((p.y - p.vy * t) % 1080 + 1080) % 1080, a = (0.18 + 0.3 * Math.sin(t * 1.3 + p.ph) ** 2) * dim;
    if (p.big) { const rg = g.createRadialGradient(x, y, 0, x, y, 46); rg.addColorStop(0, `rgba(255,205,110,${0.09 * dim})`); rg.addColorStop(1, 'rgba(255,205,110,0)'); g.fillStyle = rg; g.beginPath(); g.arc(x, y, 46, 0, 7); g.fill(); }
    else { g.fillStyle = `rgba(245,205,120,${a})`; g.beginPath(); g.arc(x, y, p.r, 0, 7); g.fill(); } });

// ---------- peças gráficas ----------

  rr(x, y, w, h, 26); g.strokeStyle = o.red ? 'rgba(224,81,60,0.9)' : goldG(x, y, x + w, y + h); g.lineWidth = o.hot ? 3.5 : 2.5; const per = 2 * (w + h); g.setLineDash([per * bp, per]); g.stroke(); g.setLineDash([]);
  if (o.hot) { g.shadowColor = 'rgba(245,200,100,0.55)'; g.shadowBlur = 36; rr(x, y, w, h, 26); g.strokeStyle = 'rgba(245,205,110,0.35)'; g.lineWidth = 2; g.stroke(); }

function badge(s, x, y, t0, t, o = {}) { const p = back(P(t, t0, 0.5)); if (p <= 0) return; const size = o.size || 30, w = measure(s, size, 800) + s.length * 3 + 70, h = size + 30; g.save(); g.translate(x + w / 2, y + h / 2); g.rotate(o.rot || 0); g.scale(p, p); g.globalAlpha *= clamp(p * 1.5); rr(-w / 2, -h / 2, w, h, h / 2); g.fillStyle = o.red ? 'rgba(224,81,60,0.95)' : goldG(-w / 2, 0, w / 2, 0); g.shadowColor = 'rgba(0,0,0,0.5)'; g.shadowBlur = 20; g.fill(); g.shadowColor = 'transparent'; font(size, 800); g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = o.red ? '#fff' : '#2a1b06'; g.letterSpacing = '3px'; g.fillText(s, 0, 2); g.restore(); return w; }

function header(num, title, sub, t0, t) {
  txt('CAPÍTULO ' + num, 130, 118, { size: 24, ls: 8, w: 700, gold: true, alpha: eo(P(t, t0 + 0.25, 0.5)) });
  const p = eo(P(t, t0 + 0.35, 0.7)); txt(title, 130, 192, { size: 68, fam: 'Playfair', w: 800, fill: WHITE, alpha: p, clipP: p }); line(130, 218, 130 + Math.min(900, measure(title, 68, 800, 'Playfair') + 20), t0 + 0.7, t);

// ---------- logos ----------
function logo(name, cx, cy, w, a = 1, shine = null) {
  const im = IMG[name]; if (!im || a <= 0) return; const h = w * im.height / im.width; g.save(); g.globalAlpha *= a; g.shadowColor = 'rgba(0,0,0,0.55)'; g.shadowBlur = 24; g.drawImage(im, cx - w / 2, cy - h / 2, w, h); g.shadowColor = 'transparent';
  if (shine !== null && shine > 0 && shine < 1) { const oc = logo.oc || (logo.oc = document.createElement('canvas')); oc.width = Math.ceil(w); oc.height = Math.ceil(h); const o = oc.getContext('2d'); o.clearRect(0, 0, oc.width, oc.height); o.drawImage(im, 0, 0, w, h); o.globalCompositeOperation = 'source-atop'; const sx = lerp(-w * 0.4, w * 1.4, shine), gr = o.createLinearGradient(sx - 90, 0, sx + 90, h * 0.35); gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.5, 'rgba(255,255,255,0.95)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); o.fillStyle = gr; o.fillRect(0, 0, oc.width, oc.height); g.drawImage(oc, cx - w / 2, cy - h / 2); }
  g.restore(); return h;

  const im = IMG.inss; if (!im || a <= 0) return; const h = w * im.height / im.width, pad = w * 0.09; g.save(); g.globalAlpha *= a; rr(cx - w / 2 - pad, cy - h / 2 - pad * 0.8, w + pad * 2, h + pad * 1.6, 26); g.fillStyle = 'rgba(247,244,236,0.97)'; g.shadowColor = 'rgba(0,0,0,0.5)'; g.shadowBlur = 36; g.shadowOffsetY = 12; g.fill(); g.shadowColor = 'transparent'; g.drawImage(im, cx - w / 2, cy - h / 2, w, h); g.restore();
}

// ---------- moldura do vídeo (a imagem entra por cima, no ffmpeg) ----------
const SLOT = { x: 130, y: 100, w: 494, h: 880 };
function slotFrame(t0, t1, t) {
  const pin = eo(P(t, t0, 0.5)), pout = 1 - eo(P(t, t1 - 0.4, 0.4)), a = Math.min(pin, pout); if (a <= 0) return; const { x, y, w, h } = SLOT; g.save(); g.globalAlpha *= a;
  g.shadowColor = 'rgba(245,190,90,0.45)'; g.shadowBlur = 60; g.fillStyle = '#000'; g.fillRect(x - 3, y - 3, w + 6, h + 6); g.shadowColor = 'transparent';
  g.strokeStyle = goldG(x - 16, y - 16, x + w + 16, y + h + 16); g.lineWidth = 5; g.strokeRect(x - 12, y - 12, w + 24, h + 24); g.lineWidth = 1.6; g.strokeRect(x - 24, y - 24, w + 48, h + 48);
  const per = 2 * (w + h), pos = ((t * 0.18) % 1) * per; g.setLineDash([180, per]); g.lineDashOffset = -pos; g.strokeStyle = 'rgba(255,245,200,0.95)'; g.lineWidth = 5; g.strokeRect(x - 12, y - 12, w + 24, h + 24); g.setLineDash([]); g.restore();
}

// ---------- cenas ----------
function head(list, t) { let cur = null; list.forEach(h => { if (t >= h.t) cur = h; }); return cur; }
function sceneV(t, key) { // abertura e fecho: video à esquerda, manchetes à direita
  const t0 = key === 'v1' ? CU.t_v1 : CU.t_v2, t1 = key === 'v1' ? CU.t_sting : CU.t_v2 + (CU.t_end - CU.t_v2);
  slotFrame(t0 + 0.05, t1, t);
  const X = 720, MW = 1100;
  let list;
  if (key === 'v1') list = [
    { t: CU.v1_negou - 0.2, kind: 'stamp', a: 'PRORROGAÇÃO NEGADA', b: 'O INSS NEGOU O PEDIDO' },
    { t: CU.v1_voltar - 0.2, kind: 'big', a: 'VOLTEI A TRABALHAR', b: 'MESMO DOENTE', icon: 'pill' },
    { t: CU.v1_justica - 0.25, kind: 'q', a: 'RECEBO O TEMPO QUE TRABALHEI DOENTE?', icon: 'question' },
    { t: CU.v1_sim - 0.1, kind: 'sim', a: 'SIM.', b: 'VOCÊ PODE TER DIREITO' },
    { t: CU.v1_muita - 0.2, kind: 'big', a: 'VOLTOU A TRABALHAR', b: 'PERDEU O DIREITO?', icon: 'question' },
    { t: CU.v1_assim - 0.35, kind: 'big', a: 'NÃO É BEM ASSIM', b: '', icon: 'check', hot: 1 },
  ]; else list = [
    { t: CU.v2_passou - 0.2, kind: 'q', a: 'VOCÊ PASSOU POR ISSO?', icon: 'question' },
    { t: CU.v2_escreve - 0.3, kind: 'comment' },
    { t: CU.v2_segue - 0.2, kind: 'sub' },
    { t: CU.v2_abraco - 0.2, kind: 'big', a: 'ATÉ A PRÓXIMA!', b: 'ALEANDRO FERREIRA ADVOCACIA', hot: 1 },
  ];
  const h = head(list, t); if (!h) { // aguardando: apenas o selo da marca
    return; }
  const lt = t - h.t, ix = P(lt, 0, 0.6), nxt = list[list.indexOf(h) + 1], ex = nxt ? P(t, nxt.t - 0.1, 0.25) : 0, A = (1 - ex) * eo(ix);
  g.save(); g.translate(-ex * 60, 0); g.globalAlpha *= clamp(1 - ex);
  if (h.kind === 'stamp') { inssLogo(X + MW / 2, 330, 560, eo(P(lt, 0, 0.6))); stamp(h.a, X + MW / 2 + 20, 560, 0.5 + h.t, t, 62); txt(h.b, X + MW / 2, 700, { size: 34, w: 700, ls: 6, align: 'center', alpha: eo(P(lt, 0.9, 0.6)), fill: 'rgba(246,241,230,0.75)' }); }
  if (h.kind === 'big') { if (h.icon) icon(h.icon, X + 90, 430, 150, h.t + 0.1, t); const L = wrap(h.a, MW - 220, 82, 800, 'Playfair'); L.forEach((l, i) => txt(l, X + 230, 400 + i * 96, { size: 82, fam: 'Playfair', gold: true, alpha: eo(P(lt, 0.15 + i * 0.12, 0.5)), clipP: eo(P(lt, 0.15 + i * 0.12, 0.6)) })); const hy = 400 + L.length * 96; if (h.b) txt(h.b, X + 230, hy + 20, { size: 54, w: 800, alpha: eo(P(lt, 0.7, 0.5)), fill: WHITE, ls: 2 }); line(X + 230, hy + 52, X + 230 + 520, h.t + 0.6, t); if (h.hot) { g.save(); g.globalAlpha *= 0.18 + 0.1 * Math.sin(t * 3); const rg = g.createRadialGradient(X + 600, 520, 10, X + 600, 520, 520); rg.addColorStop(0, 'rgba(250,205,100,1)'); rg.addColorStop(1, 'rgba(250,205,100,0)'); g.fillStyle = rg; g.fillRect(X - 100, 100, MW + 300, 800); g.restore(); } }

  g.fillStyle = goldG(cx - bw / 2, 0, cx + bw / 2, 0); g.fillRect(cx - bw * 0.3, y0 - size * 0.95 + bh - 2, bw * 0.6, 2);

}

// ---------- cenas, transições, quadro ----------
let SC = [];
function buildScenes() {
  chapters(); SC = [
    { t0: CU.t_v1, t1: CU.t_sting, draw: t => sceneV(t, 'v1'), sub: 'v', wm: 1 },
    { t0: CU.t_sting, t1: CU.t_audio, draw: sceneSting, sub: null, wm: 0 },
    ...CH.map(c => ({ t0: c.t0, t1: c.t1, draw: t => c.draw(t, c), sub: 'a', wm: 1 })),
    { t0: CU.t_audio_end, t1: CU.t_v2, draw: () => { }, sub: null, wm: 0 },
    { t0: CU.t_v2, t1: CU.t_end, draw: t => sceneV(t, 'v2'), sub: 'v', wm: 1 },
    { t0: CU.t_end, t1: CU.dur + 1, draw: sceneEnd, sub: null, wm: 0 },
  ];
}
function wmark(t, a) { if (a <= 0) return; g.save(); g.scale(S, S); logo('af', 1920 - 70 - 95, 40 + 66, 190, a * 0.95); g.restore(); }
function bar(p) { // faixa dourada da transição
  if (p <= 0 || p >= 1) return; const x = lerp(-420, 1920 + 420, eio(p)), w = 380; g.save(); g.scale(S, S); g.transform(1, 0, -0.32, 1, 0, 0); const gr = g.createLinearGradient(x - w, 0, x + w, 0); gr.addColorStop(0, 'rgba(214,160,60,0)'); gr.addColorStop(0.4, 'rgba(245,210,110,0.85)'); gr.addColorStop(0.5, 'rgba(255,248,215,1)'); gr.addColorStop(0.6, 'rgba(245,210,110,0.85)'); gr.addColorStop(1, 'rgba(214,160,60,0)'); g.fillStyle = gr; g.fillRect(x - w, -50, 2 * w, 1200); g.restore();
}
function render(t) {
  if (Q.get('cover')) { drawCover(); return; }
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1;
  drawBG(t, 1);
  let i = SC.findIndex(s => t >= s.t0 && t < s.t1); if (i < 0) i = SC.length - 1;
  const cur = SC[i], nxt = SC[i + 1], prv = SC[i - 1], TR = 0.4;
  g.save(); g.scale(S, S); g.scale(1 / S, 1 / S); g.restore();
  const drawS = (sc) => { g.save(); g.scale(S, S); const tmp = sc.draw; g.setTransform(S, 0, 0, S, 0, 0); tmp(t); g.restore(); };
  // transição: a faixa varre da esquerda para a direita; à esquerda da faixa já aparece a cena nova
  let pw = null, other = null, sw = false;
  if (nxt && t > cur.t1 - TR && !(cur.t1 === CU.t_audio_end && false)) { pw = (t - (cur.t1 - TR)) / (2 * TR); other = nxt; }
  else if (prv && t < cur.t0 + TR) { pw = (t - (cur.t0 - TR)) / (2 * TR); other = cur; }
  if (pw !== null && !(cur === SC[0])) {
    const old = other === nxt ? cur : prv, nw = other === nxt ? nxt : cur, barX = lerp(-420, 1920 + 420, eio(pw)) * S;
    g.save(); g.setTransform(S, 0, 0, S, 0, 0); old.draw(t); g.restore();
    g.save(); g.beginPath(); g.moveTo(0, 0); g.lineTo(barX + 140 * S, 0); g.lineTo(barX - 200 * S, H); g.lineTo(0, H); g.closePath(); g.clip(); drawBG(t, 1); g.setTransform(S, 0, 0, S, 0, 0); nw.draw(t); g.restore();
    bar(pw);
  } else { g.save(); g.setTransform(S, 0, 0, S, 0, 0); cur.draw(t); g.restore(); }
  g.setTransform(1, 0, 0, 1, 0, 0);
  const wm = cur.wm ? 1 : 0; wmark(t, wm * (cur === SC[0] ? eo(P(t, 0.8, 0.6)) : 1));
  if (cur.sub) drawSubs(t, cur.sub); else if (pw !== null) { const o = (other === nxt ? nxt : cur); if (o.sub) drawSubs(t, o.sub); }
}
window.render = render;

// ---------- capa (miniatura) ----------
function drawCover() {
  g.setTransform(1, 0, 0, 1, 0, 0); drawBG(2.0, 1.2); g.save(); g.setTransform(S, 0, 0, S, 0, 0);
  const ph = IMG.photo; if (ph) { const x = 1090, y = 70, w = 700, h = 940; g.save(); g.shadowColor = 'rgba(245,190,90,0.55)'; g.shadowBlur = 70; g.fillStyle = '#000'; g.fillRect(x - 4, y - 4, w + 8, h + 8); g.restore(); g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip(); const sc = w / ph.width; g.drawImage(ph, 0, 0, ph.width, ph.height, x, y - 300, w, ph.height * sc); const gr = g.createLinearGradient(x, y + h * 0.65, x, y + h); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(10,7,3,0.55)'); g.fillStyle = gr; g.fillRect(x, y, w, h); g.restore(); g.strokeStyle = goldG(x, y, x + w, y + h); g.lineWidth = 7; g.strokeRect(x - 14, y - 14, w + 28, h + 28); g.lineWidth = 2; g.strokeRect(x - 30, y - 30, w + 60, h + 60); }

  g.save(); g.strokeStyle = RED; g.lineWidth = 10; g.lineCap = 'round'; g.beginPath(); g.moveTo(96, 706); g.lineTo(640, 702); g.stroke(); g.restore();

}
