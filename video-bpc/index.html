<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>BPC e o 13º — lousa</title>
<style>html,body{margin:0;background:#241709;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script src="lousa-core.js"></script>
<script src="bpc.js"></script>
<script>
const W = innerWidth, H = innerHeight, S = W / 1080; const cv = document.getElementById('c'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
const Q = new URLSearchParams(location.search);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, t) => a + (b - a) * t, ss = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const eo = t => 1 - Math.pow(1 - clamp(t), 3), eio = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const back = t => { t = clamp(t); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const P = (t, a, d) => clamp((t - a) / d);
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const goldG = (x0, y0, x1, y1) => { const gr = g.createLinearGradient(x0, y0, x1, y1); [[0, '#fff3c0'], [0.28, '#f5d268'], [0.52, '#d9a53a'], [0.76, '#a8741c'], [1, '#e9c25a']].forEach(([o, c]) => gr.addColorStop(o, c)); return gr; };
const IMG = {}; const load = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
window.DUR = 29.44;
let WORDS = [], CUES = [];
function drawBG(t) {
  g.setTransform(1, 0, 0, 1, 0, 0); const gr = g.createRadialGradient(W * 0.5, H * 0.4, 30, W * 0.5, H * 0.5, W * 0.85); gr.addColorStop(0, '#5a4020'); gr.addColorStop(0.55, '#33230f'); gr.addColorStop(1, '#150e06'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.save(); g.scale(S, S); for (let i = 0; i < 40; i++) { const x = ((i * 137.5 + t * (4 + i % 5)) % 1080), y = ((i * 91.3 - t * (6 + i % 7)) % 1080 + 1080) % 1080; g.fillStyle = `rgba(245,205,120,${0.12 + 0.18 * Math.sin(t * 1.3 + i) ** 2})`; g.beginPath(); g.arc(x, y, 1 + i % 3 * 0.7, 0, 7); g.fill(); } g.restore();
}
// ---- legenda: grande, com a palavra falada em destaque ----
function makeCues() {
  const norm = s => s.toLowerCase().replace(/[^\wà-ú]/g, ''); const ws = WORDS.map(([w, a, b]) => [w, a, b]);
  ws.forEach(x => { if (norm(x[0]) === 'loas') x[0] = 'LOAS'; }); const ic = ws.findIndex(x => norm(x[0]) === 'conto'); if (ic >= 0 && norm(ws[ic + 1][0]) === 'que') ws[ic + 1][0] = 'o que';
  const out = []; let cur = [];
  const flush = () => { if (cur.length) { out.push(cur.slice()); cur = []; } };
  ws.forEach((x, i) => { cur.push(x); const txt = cur.map(c => c[0]).join(' '), nx = ws[i + 1], gap = nx ? nx[1] - x[2] : 9; if (/[.?!]$/.test(x[0]) || gap > 0.45 || txt.length > 30 || (/,$/.test(x[0]) && txt.length > 16)) flush(); }); flush();
  CUES = out.map((c, k) => { const words = c.map((x, j) => ({ w: x[0], a: x[1], b: j + 1 < c.length ? c[j + 1][1] : Math.max(x[2], x[1] + 0.25) })); const t0 = Math.max(0, words[0].a - 0.1); let t1 = words[words.length - 1].b + 0.45; const nx = out[k + 1]; if (nx) t1 = Math.min(t1, nx[0][1] - 0.12); return { t0, t1: Math.max(t1, t0 + 1.2), words }; });
}
function drawSubs(t) {
  const c = CUES.find(c => t >= c.t0 && t <= c.t1); if (!c) return; const al = Math.min(eo(P(t, c.t0, 0.15)), 1 - eo(P(t, c.t1 - 0.18, 0.18)));
  g.save(); g.setTransform(S, 0, 0, S, 0, 0); g.globalAlpha = al; let size = 66; const maxW = 940, cx = 540, base = 985; let L, sp;
  for (; size > 40; size -= 4) { g.font = `800 ${size}px Montserrat, sans-serif`; sp = g.measureText(' ').width; const it = c.words.map(w => ({ ...w, w2: g.measureText(w.w).width })); L = [[]]; let cw = 0; it.forEach(x => { if (cw + x.w2 > maxW && L[L.length - 1].length) { L.push([]); cw = 0; } L[L.length - 1].push(x); cw += x.w2 + sp; }); if (L.length <= 2) break; }
  const lh = size * 1.28, y0 = base - (L.length - 1) * lh; g.textBaseline = 'alphabetic';
  const bw = Math.max(...L.map(l => l.reduce((s, x) => s + x.w2, 0) + sp * (l.length - 1))) + 90, bh = L.length * lh + 30; const gb = g.createLinearGradient(cx - bw / 2, 0, cx + bw / 2, 0); gb.addColorStop(0, 'rgba(28,18,8,0)'); gb.addColorStop(0.1, 'rgba(28,18,8,0.7)'); gb.addColorStop(0.9, 'rgba(28,18,8,0.7)'); gb.addColorStop(1, 'rgba(28,18,8,0)'); g.fillStyle = gb; g.fillRect(cx - bw / 2, y0 - size * 0.95, bw, bh);
  L.forEach((l, li) => { const lw = l.reduce((s, x) => s + x.w2, 0) + sp * (l.length - 1); let x = cx - lw / 2; const y = y0 + li * lh;
    l.forEach(it => { const cur = t >= it.a && t < it.b, done = t >= it.b; g.save(); g.shadowColor = 'rgba(0,0,0,0.85)'; g.shadowBlur = 10; g.shadowOffsetY = 3;
      if (cur) { const k = clamp((t - it.a) / 0.14), s2 = 1 + 0.045 * Math.sin(Math.PI * k); g.translate(x + it.w2 / 2, y - size * 0.34); g.scale(s2, s2); g.translate(-(x + it.w2 / 2), -(y - size * 0.34)); g.shadowColor = 'rgba(255,200,90,0.9)'; g.shadowBlur = 24; g.fillStyle = goldG(x, y - size, x + it.w2, y); }
      else g.fillStyle = done ? '#fff' : 'rgba(255,255,255,0.55)'; g.fillText(it.w, x, y); g.restore(); x += it.w2 + sp; }); });
  g.restore();
}
function mark(t) { const im = IMG.af; if (!im) return; const cta = window.ANCH ? P(t, window.ANCH.segue + 0.2, 0.8) : 0; g.save(); g.setTransform(S, 0, 0, S, 0, 0); g.shadowColor = 'rgba(0,0,0,0.5)'; g.shadowBlur = 14;
  if (cta > 0) { const w = lerp(120, 430, eio(cta)), h = w * im.height / im.width, cx = lerp(1030 - 60 - 16, 540, eio(cta)), cy = lerp(40 + 14 + h / 2, 270, eio(cta)); g.globalAlpha = 0.95; g.drawImage(im, cx - w / 2, cy - h / 2, w, h); }
  else { const w = 120, h = w * im.height / im.width; g.globalAlpha = 0.95; g.drawImage(im, 1030 - w - 16, 40 + 14, w, h); } g.restore(); }
function render(t) {
  drawBG(t);
  if (Q.get('cover')) { lousaDraw('01', 0.02); const im = IMG.af; if (im) { g.save(); g.setTransform(S, 0, 0, S, 0, 0); const w = 330, hh = w * im.height / im.width; g.shadowColor = 'rgba(0,0,0,0.55)'; g.shadowBlur = 18; g.drawImage(im, 540 - w / 2, 960 - hh / 2, w, hh); g.restore(); } return; }
  lousaDraw('01', t); mark(t); drawSubs(t);
}
window.render = render;
(async () => {
  try { for (const [n, u, w] of [['Montserrat', 'fonts/Montserrat800.woff2', '800'], ['Caveat', 'fonts/Caveat.woff2', '600']]) { const f = new FontFace(n, `url(${u})`, { weight: w }); await f.load(); document.fonts.add(f); } } catch (e) { console.error('[font]', e); }
  WORDS = await (await fetch('work/words.json')).json(); makeCues(); IMG.af = await load('assets/logo-af.png');
  bakeBoard(); buildBPC(WORDS); render(0); window.READY = true;
})();
</script></body></html>
